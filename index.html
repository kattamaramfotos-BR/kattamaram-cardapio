<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#071a2b">
    <title>Kattamaram II — Cardápio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
    <div class="top">
        <span id="menuLabel">☰ MENU</span>
        <b>KATTAMARAM II</b>
        <div class="languagePicker">
            <button id="languageButton" class="languageButton" type="button">PT-BR</button>
            <div id="languageMenu" class="languageMenu">
                <button type="button" data-lang="pt-BR">🇧🇷 PT-BR</button>
                <button type="button" data-lang="en">🇺🇸 ENGLISH</button>
                <button type="button" data-lang="es">🇪🇸 ESPAÑOL</button>
            </div>
        </div>
    </div>

    <!-- ✅ Foto do barco + Texto com BORDA/CONTORNO nas letras -->
    <div class="heroText" style="position: relative; width: 100%; padding: 0;">
        <img src="Imagen Cardapio.jpg" alt="Barco Kattamaram II" style="width: 100%; height: 380px; object-fit: cover; border-radius: 4px;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; width: 100%;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8), -1px -1px 3px rgba(0,0,0,0.8), 1px -1px 3px rgba(0,0,0,0.8), -1px 1px 3px rgba(0,0,0,0.8);">
            
            <div style="font-size: 28px; margin-bottom: 8px;">⚓</div>
            <small id="heroSmall" style="font-size: 15px;">KATTAMARAM II • FOZ DO IGUAÇU</small>
            <h1 id="heroTitle" style="font-size: 42px; margin: 10px 0;">CARDÁPIO <i id="heroAboard">a bordo</i></h1>
            <p id="heroDesc" style="font-size: 16px; margin-top: 10px;">Sabores especiais para tornar seu passeio ainda melhor.</p>
        </div>
    </div>
    <!-- ✅ Fim da seção atualizada -->

</header>
<main>
    <section>
        <h2 id="categoriesTitle">NOSSAS CATEGORIAS</h2>
        <div id="cats" class="cats"></div>
    </section>
    <section>
        <h2 id="featuredTitle">DESTAQUES DO CARDÁPIO</h2>
        <div id="featured" class="grid"></div>
    </section>
    <section id="productsSection">
        <h2 id="title">PRODUTOS</h2>
        <div id="products" class="grid"></div>
    </section>
</main>
<footer id="footerText">KATTAMARAM II • FOZ DO IGUAÇU • @KATTAMARAMFOZ</footer>
<div id="modal" class="modal" onclick="closeModal(event)">
    <button class="close" type="button" onclick="closeModal(event)">×</button>
    <img id="mi">
    <h3 id="mn"></h3>
    <p id="md"></p>
    <strong id="mp"></strong>
    <div id="modalOptions"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
